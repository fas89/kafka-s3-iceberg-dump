# Shared infrastructure for the multi-engine Kafka -> Iceberg demo.
#
# This file defines only what every engine shares: MinIO (S3 storage),
# Postgres (Iceberg JDBC catalog), Kafka (mTLS broker), the Maven `builder`,
# and the `producer` data source. Each ingestion engine is added by an overlay:
#
#   docker compose -f docker-compose.yml -f docker-compose.flink.yml   up --build
#   docker compose -f docker-compose.yml -f docker-compose.spark.yml   up --build
#   docker compose -f docker-compose.yml -f docker-compose.duckdb.yml  up --build
#   docker compose -f docker-compose.yml -f docker-compose.connect.yml up --build
#
# Every engine consumes the same `events` topic, writes its own Iceberg
# namespace (flink_db / spark_db / duckdb_db / connect_db) and runs its own
# table maintenance. The `builder` compiles every module's fat jar once.

name: s3-table-dump

services:
  # ---------------------------------------------------------------- storage --
  minio:
    # MinIO archived its own Docker Hub repo in 2025; alpine/minio is the
    # actively-maintained community rebuild (this is the security-patched
    # Oct-2025 release). Same binary -> same command and env vars.
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    # alpine/minio runs as uid 100; the official image ran as root. Run as
    # root so it can write the fresh root-owned named volume.
    user: "0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    ports:
      # Bound to localhost only — the demo stack is not meant to be reachable
      # from other hosts on the network.
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # web console
    volumes:
      - minio-data:/data

  minio-setup:
    # No mc needed: in MinIO's single-drive backend a top-level directory under
    # the data dir IS a bucket. Reuse the alpine/minio image's own shell to
    # create it once minio has formatted the drive (.minio.sys appears).
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    user: "0"
    depends_on:
      - minio
    volumes:
      - minio-data:/data
    entrypoint: >
      /bin/sh -c "
      until [ -d /data/.minio.sys ]; do
        echo 'waiting for minio to format drive...'; sleep 2;
      done;
      mkdir -p /data/warehouse;
      echo 'minio bucket ready'"

  postgres:
    image: postgres:17.10
    environment:
      POSTGRES_USER: iceberg
      POSTGRES_PASSWORD: iceberg
      POSTGRES_DB: iceberg
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iceberg -d iceberg"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ------------------------------------------------------------------ kafka --
  kafka:
    image: apache/kafka:4.0.0
    volumes:
      - ./certs:/etc/kafka/secrets:ro
    environment:
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093,SSL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: SSL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,SSL:SSL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: SSL
      # mTLS: every client (and the broker itself) presents a CA-signed cert.
      # The apache/kafka image reads store passwords from a credentials file.
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_KEYSTORE_FILENAME: broker.keystore.p12
      KAFKA_SSL_KEYSTORE_CREDENTIALS: creds
      KAFKA_SSL_KEY_CREDENTIALS: creds
      KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
      KAFKA_SSL_TRUSTSTORE_FILENAME: truststore.p12
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: creds
      KAFKA_SSL_CLIENT_AUTH: required
      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: ""
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9092' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-setup:
    image: apache/kafka:4.0.0
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./certs:/etc/kafka/secrets:ro
    entrypoint: >
      /bin/sh -c "
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
        --command-config /etc/kafka/secrets/client-ssl.properties
        --create --if-not-exists --topic events --partitions 3 --replication-factor 1;
      echo 'kafka topic ready'"

  # ------------------------------------------------------------ build & data --
  builder:
    image: maven:3.9.9-eclipse-temurin-21
    working_dir: /src
    volumes:
      - ./:/src
      - maven-cache:/root/.m2
      - job:/out
    # APP_VERSION is interpolated by Docker Compose from the host env, so a
    # release build is: APP_VERSION=$(git-semver-release version) docker compose up --build
    command: >
      /bin/sh -c "
      mvn -q -DskipTests -Drevision='${APP_VERSION:-0.0.0-SNAPSHOT}' clean package &&
      cp /src/engine-flink/target/app.jar      /out/engine-flink.jar &&
      cp /src/engine-spark/target/app.jar      /out/engine-spark.jar &&
      cp /src/engine-duckdb/target/app.jar     /out/engine-duckdb.jar &&
      cp /src/flink-maintenance/target/app.jar /out/flink-maintenance.jar &&
      cp /src/spark-maintenance/target/app.jar /out/spark-maintenance.jar &&
      cp /src/producer/target/app.jar          /out/producer.jar &&
      cp /src/tools/target/app.jar             /out/tools.jar &&
      cp /root/.m2/repository/org/postgresql/postgresql/42.7.4/postgresql-42.7.4.jar /out/postgresql.jar &&
      echo 'fat jars built -> /out'"

  # The Java mTLS producer is the demo data source (replaces the kcat datagen
  # script). It streams JSON events to the `events` topic until the stack is
  # stopped; benchmark runs override the command with --count N.
  producer:
    image: eclipse-temurin:21-jre
    depends_on:
      builder:
        condition: service_completed_successfully
      kafka-setup:
        condition: service_completed_successfully
    volumes:
      - job:/jars:ro
      - ./certs:/certs:ro
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: events
      CERT_DIR: /certs
      INTERVAL_MS: "500"
      # 0 = continuous (the demo data source); a benchmark run exports
      # RECORD_COUNT=N so the producer emits exactly N events and exits.
      RECORD_COUNT: "${RECORD_COUNT:-0}"
    command: ["java", "-jar", "/jars/producer.jar"]

  # Reads an engine's Iceberg table metrics for the benchmark harness. Profile-
  # gated so it never starts with `up`; the benchmark invokes it with
  # `docker compose run --rm tools`.
  tools:
    image: eclipse-temurin:21-jre
    profiles: ["tools"]
    depends_on:
      builder:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    volumes:
      - job:/jars:ro
    environment:
      AWS_REGION: us-east-1
    command: ["java", "-jar", "/jars/tools.jar"]

  # Compaction-strategy benchmark (binpack / sort / zorder). Profile-gated so it
  # never starts with `up`; benchmark/compaction.sh invokes it one-shot per
  # strategy with `docker compose run`, setting MAINTENANCE_REWRITE_STRATEGY.
  compaction-bench:
    image: apache/spark:4.0.0-java21
    profiles: ["tools"]
    depends_on:
      builder:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    volumes:
      - job:/jars:ro
    environment:
      AWS_REGION: us-east-1
    entrypoint: ["/opt/spark/bin/spark-submit"]
    command:
      - "--master"
      - "local[*]"
      - "--class"
      - "com.example.iceberg.sparkmaintenance.CompactionBenchmark"
      - "/jars/spark-maintenance.jar"

volumes:
  minio-data:
  maven-cache:
  job:
